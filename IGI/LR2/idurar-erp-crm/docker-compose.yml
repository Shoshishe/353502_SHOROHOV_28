version: '3'
services: 
  mongodb: 
    container_name: "mongo"
    ports:
      - 27017:27017
    image: mongo:8.0.5
    volumes:
      - db_conf:/var/lib/mongodb
    restart: unless-stopped
  backend:
    container_name: "back"
    env_file: 
      - path: ./backend/.env
        required: true
    restart: always
    build: 
      target: backend
    ports:
      - 8888:8888
    depends_on: 
      - mongodb
  frontend:
    env_file: 
      - path: ./frontend/.env
        required: true
    build:
      target: frontend
    depends_on: 
    - backend
    ports:
      - 3000:3000
volumes:
  db_conf:
    
     
  