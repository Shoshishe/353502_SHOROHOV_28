version: '3'
services: 
  mongodb: 
    image: mongo:8.0.5
    restart: unless-stopped
  
  #Not that hard, since react/redux/node is all js
  app:
    container_name: "main_app"
    restart: always
    build: 
      context: ../LR2/React-Redux-Node-Mongodb
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - db_conf:../LR2/React-Redux-Node-Mongodb/server
    depends_on: 
      - mongodb
volumes:
  db_conf:
    
     
  