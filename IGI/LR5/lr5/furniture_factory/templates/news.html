{% extends 'base.html' %}
{% block style %}
  <style>
    .box {
      border: 10px solid black;
      padding: 10px;
      margin: 10px;
    }
  </style>
{% endblock %}
{% block content %}
  <article class="box" style="width: max-content; height: max-content;">
    <h2>{{ header }}</h2>
    <image src="{{ image.url }}" width="500" height="300"></image>
    <p>{{ content }}</p>
  </article>
  <a href="/"><button>Return</button></a>
{% endblock %}
