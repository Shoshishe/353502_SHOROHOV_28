{% extends 'base.html' %}

{% block title %}
  Login
{% endblock %}

{% block content %}
  <h2>Log In</h2>
  {{ error }}
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <div>{{ field.name.title }}</div>
        <div>{{ field }}</div>
        {% for error in field.errors %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endfor %}
      </div>
    {% endfor %}
    <input type="submit" value="Log in" />
  </form>
  <a href="/"><button>Return</button></a>
  {% include 'preloader.html' %}
{% endblock %}
